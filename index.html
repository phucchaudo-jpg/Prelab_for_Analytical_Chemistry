<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#1b2430;--mut:#5d6b7c;--pri:#0b6b5d;--pri2:#e3f4f0;--bad:#b3261e;--bad2:#fdeceb;--ok:#1b7a3d;--ok2:#e6f6ec;--bd:#d6dde8}

input{-webkit-user-select:text;user-select:text}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem;margin:.2em 0 .8em}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text]{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font-size:1rem}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:11px 20px;background:var(--pri);color:#fff;font-weight:600}
button.sec{background:var(--pri2);color:var(--pri)}button:disabled{opacity:.45;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--bd);margin:8px 0;padding:12px 14px;font-weight:400}
.opt.sel{border-color:var(--pri);background:var(--pri2)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pri)}
.meta{color:var(--mut);font-size:.9rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.seq{list-style:none;padding:0;margin:0}
.seq li{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0;cursor:grab}
.seq li.drag{opacity:.4}.seq li span{flex:1}.seq b{color:var(--pri);min-width:1.5em}
.seq button{padding:4px 10px;background:var(--pri2);color:var(--pri)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.score{font-size:2.2rem;font-weight:800;color:var(--pri)}
.rq{border-left:5px solid var(--bad);background:var(--bad2);border-radius:8px;padding:10px 14px;margin:10px 0;break-inside:avoid}
.rq.ok{border-color:var(--ok);background:var(--ok2)}.rq p{margin:.25em 0}.rq small{color:var(--mut)}
.hide{display:none!important}.err{color:var(--bad);font-weight:600;min-height:1.4em}
#print-head{display:none}
.map{display:block;max-width:100%;max-height:60vh;margin:0 auto 12px;border:1px solid var(--bd);border-radius:8px;pointer-events:none}
@media print{body{background:#fff;-webkit-user-select:text}.wrap{padding:0;max-width:none}.card{border:0;padding:0}.noprint,#app>section:not(#report){display:none!important}#print-head{display:block}}
</style></head><body>

(()=>{
"use strict";
const $=id=>document.getElementById(id);
const bank=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(DATA),(c,i)=>c.charCodeAt(0)^KEY.charCodeAt(i%KEY.length))));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const W=CONFIG.windows.map(w=>({s:+new Date(w.start),e:+new Date(w.end)}));
const cur=()=>W.find(w=>Date.now()>=w.s&&Date.now()<w.e);
const fmt=t=>new Date(t).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
let S=null,tick=null,showing="";
function show(id){showing=id;["closed","login","quiz","report"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function gate(){
  if(S&&!S.done){ if(!cur()||(S.deadline&&Date.now()>S.deadline)) finish(); return; }
  if(showing==="report")return;
  const w=cur();
  if(w){ $("winnow").textContent="Open until "+fmt(w.e); if(showing!=="login")show("login"); }
  else{ const n=W.filter(x=>x.s>Date.now()).sort((a,b)=>a.s-b.s)[0];
    $("nextwin").textContent=n?"Next session opens: "+fmt(n.s):"No upcoming sessions are scheduled.";
    show("closed"); }
}
setInterval(()=>{gate();if(S&&!S.done&&S.deadline){const m=Math.max(0,S.deadline-Date.now())/1000|0;$("tleft").textContent="⏱ "+(m/60|0)+":"+String(m%60).padStart(2,"0")}},1000);

$("start").onclick=()=>{
  const name=$("nm").value.trim(),id=$("sid").value.trim();
  if(name.length<2||!id){$("lerr").textContent="Please enter your full name and student ID.";return}
  startAttempt(name,id,1);
};
function pick(list,n,seen){
  let p=shuf(list.filter(q=>!seen.includes(q.id)));
  if(p.length<n)p=p.concat(shuf(list.filter(q=>seen.includes(q.id))));
  return p.slice(0,n);
}
function startAttempt(name,id,attempt){
  const w=cur(); if(!w){S=null;showing="";gate();return}
  const hk="seen5:"+id.toLowerCase();let seen=[];
  try{seen=JSON.parse(localStorage.getItem(hk)||"[]")}catch(e){}
  const def=bank.filter(q=>!q.s);
  const chosen=w.session?pick(bank.filter(q=>q.s===w.session),CONFIG.sessionQuestions,seen).concat(pick(def,CONFIG.defaultQuestions,seen))
                        :pick(def,CONFIG.questionsPerTest,seen);
  const qs=shuf(chosen).map(q=>{
    const o={id:q.id,img:!!q.img,type:q.type,cat:q.category,q:q.question,exp:q.explanation};
    if(q.type==="word_arrange"){
      const right=q.correct_order.map(i=>q.items_to_order[i]);
      let it=shuf(right);for(let k=0;k<9&&it.join()===right.join();k++)it=shuf(right);
      o.items=it;o.right=right;o.given=it.slice();o.touched=false;
    }else{o.opts=q.type==="mcq"?shuf(q.options):q.options;o.right=q.correct_answer;o.given=null}
    return o});
  try{localStorage.setItem(hk,JSON.stringify([...new Set(seen.concat(qs.map(q=>q.id)))]))}catch(e){}
  S={name,id,qs,i:0,attempt,done:false,deadline:CONFIG.minutesAllowed?Math.min(w.e,Date.now()+CONFIG.minutesAllowed*6e4):w.e};
  show("quiz");render();
}
function render(){
  const q=S.qs[S.i],n=S.qs.length;
  $("qn").textContent="Question "+(S.i+1)+" of "+n;$("pb").style.width=((S.i+1)/n*100)+"%";
  $("qcat").textContent={mcq:"Multiple choice",true_false:"True / False",word_arrange:"Arrange in correct order"}[q.type];
  $("qt").textContent=q.q;const a=$("qa");a.innerHTML="";if(q.img){const m=new Image();m.src=MAP;m.alt="Lab 502 map";m.className="map";m.draggable=false;a.appendChild(m)}
  if(q.type==="word_arrange"){
    const ul=document.createElement("ul");ul.className="seq";a.appendChild(ul);
    const draw=()=>{ul.innerHTML="";q.given.forEach((t,k)=>{
      const li=document.createElement("li");li.draggable=true;
      li.innerHTML='<b>'+(k+1)+'.</b><span></span><button class="up" aria-label="Move up">▲</button><button class="dn" aria-label="Move down">▼</button>';
      li.children[1].textContent=t;
      const mv=d=>{const j=k+d;if(j<0||j>=q.given.length)return;[q.given[k],q.given[j]]=[q.given[j],q.given[k]];q.touched=true;draw()};
      li.querySelector(".up").onclick=()=>mv(-1);li.querySelector(".dn").onclick=()=>mv(1);
      li.ondragstart=e=>{e.dataTransfer.setData("text/plain",k);li.classList.add("drag")};
      li.ondragend=()=>li.classList.remove("drag");
      li.ondragover=e=>e.preventDefault();
      li.ondrop=e=>{e.preventDefault();const f=+e.dataTransfer.getData("text/plain");if(f===k)return;
        const [m]=q.given.splice(f,1);q.given.splice(k,0,m);q.touched=true;draw()};
      ul.appendChild(li)})};
    draw();
    const p=document.createElement("p");p.className="meta";p.textContent="Drag items (or use ▲▼) to put them in the correct order.";a.appendChild(p);
  }else q.opts.forEach(o=>{
    const b=document.createElement("button");b.className="opt"+(q.given===o?" sel":"");b.textContent=o;
    b.onclick=()=>{q.given=o;[...a.children].forEach(c=>c.classList.remove("sel"));b.classList.add("sel")};a.appendChild(b)});
  $("prev").disabled=S.i===0;$("next").textContent=S.i===n-1?"Submit ✔":"Next →";
}
$("prev").onclick=()=>{S.i--;render()};
$("next").onclick=()=>{
  if(S.i<S.qs.length-1){S.i++;render();return}
  const un=S.qs.filter(q=>q.type==="word_arrange"?false:q.given===null).length;
  if(!confirm(un?un+" question(s) unanswered. Submit anyway?":"Submit your answers now?"))return;
  finish();
};
const ok=q=>q.type==="word_arrange"?q.given.join("\u0001")===q.right.join("\u0001"):q.given===q.right;
function finish(){
  if(!S||S.done)return;S.done=true;
  const sc=S.qs.filter(ok).length,n=S.qs.length,pct=Math.round(sc/n*100);
  $("rn").textContent=S.name;$("ri").textContent=S.id;$("rt").textContent=new Date().toLocaleString([], {dateStyle:"full",timeStyle:"medium"});
  $("rs").textContent=sc+" / "+n+" ("+pct+"%)";const pass=pct>=CONFIG.passMark;$("rp").textContent=(pass?"Result: PASS":"Result: Not passed – you need "+CONFIG.passMark+"% to pass")+"  |  Attempt "+S.attempt;$("redo").classList.toggle("hide",pass);
  const L=$("rl");L.innerHTML="";
  S.qs.forEach((q,i)=>{
    const d=document.createElement("div"),good=ok(q);d.className="rq"+(good?" ok":"");
    const row=(l,t)=>{const p=document.createElement("p");const b=document.createElement("b");b.textContent=l;p.append(b,t);d.appendChild(p)};
    row((i+1)+". "+(good?"✔ ":"✘ "),q.q);
    const fa=a=>Array.isArray(a)?a.map((t,k)=>(k+1)+") "+t).join("  "):a;
    row("Your answer: ",q.type==="word_arrange"&&!q.touched&&!good?fa(q.given)+" (not changed)":(q.given===null?"(no answer)":fa(q.given)));
    if(good&&q.exp){const s=document.createElement("small");s.textContent="Explanation: "+q.exp;d.appendChild(s)}
    L.appendChild(d)});
  show("report");window.scrollTo(0,0);S.qs.forEach(q=>q.right=q.right); 
}
$("redo").onclick=()=>{const n=S.name,i=S.id,a=S.attempt+1;startAttempt(n,i,a)};
$("pdf").onclick=()=>{document.title="LabSafety_"+S.id+"_"+S.name.replace(/\s+/g,"_");window.print()};
/* deterrents (not true security – see instructor notes) */
document.addEventListener("contextmenu",e=>{if(!e.target.closest("input"))e.preventDefault()});
